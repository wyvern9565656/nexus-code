[package]
name = "rust-text-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "thread-pool", "x11", "wayland", "image", "linux-theme-detection"] }
scrive-iced = { path = "vendor/scrive-iced" }
scrive-core = "0.3.3"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
